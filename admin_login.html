<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrator Login | E-Grievance Portal</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: "Segoe UI", Arial, sans-serif; color: #183153; background: radial-gradient(circle at 15% 15%, #dce9ff, transparent 32%), linear-gradient(135deg, #eef4ff, #f8faff); }
    .login-card { width: 100%; max-width: 440px; background: #fff; padding: 38px; border-radius: 22px; box-shadow: 0 18px 55px #18315318; border: 1px solid #e1e9f7; }
    .icon { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 17px; color: white; background: linear-gradient(135deg,#183e82,#3978ed); font-size: 27px; margin-bottom: 22px; }
    .eyebrow { color: #3265c9; font-size: 12px; letter-spacing: 2px; font-weight: 800; margin: 0 0 8px; }
    h1 { margin: 0 0 10px; font-size: 29px; }
    .intro { margin: 0 0 27px; color: #697a92; line-height: 1.6; }
    label { display: block; margin: 16px 0 7px; font-weight: 650; font-size: 14px; }
    input { width: 100%; padding: 13px 14px; border: 1px solid #d7e0ee; border-radius: 10px; font: inherit; outline: none; }
    input:focus { border-color: #3978ed; box-shadow: 0 0 0 3px #3978ed20; }
    button { width: 100%; margin-top: 23px; border: 0; border-radius: 10px; padding: 14px; color: white; background: #245bd1; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #1948ad; } button:disabled { opacity: .65; cursor: wait; }
    #message { min-height: 24px; margin: 13px 0 0; color: #b42318; font-size: 14px; }
    .back { display: block; text-align: center; margin-top: 18px; color: #3265c9; text-decoration: none; font-size: 14px; }
    .secure { text-align: center; color: #718096; font-size: 12px; margin-top: 22px; }
    @media (max-width: 480px) { .login-card { padding: 28px 22px; } h1 { font-size: 25px; } }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="icon" aria-hidden="true">🔐</div>
    <p class="eyebrow">SECURE ADMIN ACCESS</p>
    <h1>Administrator Login</h1>
    <p class="intro">Please enter your administrator username and password to open the grievance management portal.</p>
    <form id="adminLoginForm">
      <label for="username">Administrator Name</label>
      <input id="username" name="username" type="text" placeholder="Enter administrator name" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
      <button id="loginButton" type="submit">Verify and Open Portal</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
    <a class="back" href="/">← Back to role selection</a>
    <p class="secure">🔒 Administrator access is protected by server-side authentication.</p>
  </main>
  <script>
    const form = document.getElementById('adminLoginForm');
    const message = document.getElementById('message');
    const button = document.getElementById('loginButton');
    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      message.textContent = '';
      button.disabled = true;
      button.textContent = 'Checking credentials...';
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: form.username.value.trim(), password: form.password.value })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Login failed.');
        window.location.href = '/portal';
      } catch (error) {
        message.textContent = error.message || 'Unable to log in. Please try again.';
        button.disabled = false;
        button.textContent = 'Verify and Open Portal';
      }
    });
  </script>
</body>
</html>
